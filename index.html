<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Video Survey - Anjali Kushwaha</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lato', sans-serif;
    }

    body {
      background: #7dd3fc;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.85) 0 25px, transparent 26px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.75) 0 20px, transparent 21px),
        radial-gradient(circle at 60% 80%, rgba(255,255,255,0.8) 0 30px, transparent 31px);
      animation: skyMove 12s ease-in-out infinite alternate;
    }

    @keyframes skyMove {
      0% {
        background-color: #7dd3fc;
        background-position: 0% 0%, 100% 20%, 50% 100%;
      }

      50% {
        background-color: #93c5fd;
        background-position: 10% 5%, 90% 30%, 60% 90%;
      }

      100% {
        background-color: #67e8f9;
        background-position: 20% 10%, 80% 40%, 70% 80%;
      }
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.7) 0 18px, transparent 19px),
        radial-gradient(circle at 80% 25%, rgba(255,255,255,0.6) 0 14px, transparent 15px),
        radial-gradient(circle at 60% 75%, rgba(255,255,255,0.65) 0 20px, transparent 21px);
      animation: cloudsMove 18s linear infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes cloudsMove {
      0% {
        transform: translateX(0px);
      }

      100% {
        transform: translateX(20px);
      }
    }



    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
      min-height: auto;
      background: #fffdf5;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 12px 0 #f59e0b, 0 25px 50px rgba(0,0,0,0.18);
      border: 8px solid #ffffff;
    }

    .header {
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ff8a65;
      color: white;
      border-bottom: 6px solid #ff7043;
    }

    .header h1 {
      font-size: 36px;
      margin-bottom: 6px;
      font-weight: 900;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.12);
    }

    .header p {
      color: rgba(255,255,255,0.9);
    }

    video {
      width: 100%;
      height: 620px;
      min-height: auto;
      object-fit: cover;
      background: black;
    }

    .question-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.92);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .question-box {
      background: #ffffff;
      padding: 40px;
      border-radius: 35px;
      width: 100%;
      max-width: 900px;
      text-align: center;
      border: 8px solid #facc15;
      box-shadow: 0 10px 0 #eab308;
    }

    .question-box h2 {
      margin-bottom: 30px;
      font-size: 32px;
      color: #2563eb;
      line-height: 1.4;
      font-weight: 900;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .answers button {
      padding: 22px;
      border: none;
      border-radius: 18px;
      background: #4ade80;
      color: white;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 0 #16a34a;
    }

    .answers button:hover {
      transform: translateY(3px);
      box-shadow: 0 4px 0 #059669;
      background: #22c55e;
    }

    .footer {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff7ed;
    }

    .progress-bar {
      width: 250px;
      height: 18px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      border: 4px solid white;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #f43f5e;
      transition: width 0.5s ease;
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: 80px 20px;
    }

    .result-screen h2 {
      font-size: 56px;
      margin-bottom: 20px;
      color: #7c3aed;
    }

    .result-screen p {
      font-size: 24px;
      color: #bbb;
      margin-bottom: 30px;
    }

    .restart-btn {
      padding: 18px 34px;
      font-size: 22px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
      color: white;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    .restart-btn:hover {
      transform: scale(1.05);
    }

    .video-wrapper {
      position: relative;
    }

    @media(max-width: 1400px) {
      .container {
        max-width: 1180px;
      }

      video {
        height: 65vh;
      }
    }

    @media(max-width: 1024px) {
      body {
        padding: 14px;
      }

      .container {
        border-radius: 28px;
      }

      .header {
        padding: 18px;
        flex-direction: column;
        text-align: center;
        gap: 12px;
      }

      .header h1 {
        font-size: 30px;
      }

      video {
        height: 55vh;
        min-height: 400px;
      }

      .question-box {
        padding: 30px;
        border-width: 6px;
      }

      .question-box h2 {
        font-size: 30px;
      }

      .answers button {
        font-size: 20px;
        padding: 18px;
      }

      .footer {
        flex-direction: column;
        gap: 16px;
      }

      .progress-bar {
        width: 100%;
      }
    }

    @media(max-width: 768px) {
      body {
        padding: 10px;
      }

      .container {
        border-radius: 22px;
        border-width: 5px;
      }

      #welcomeScreen {
        padding: 35px 20px !important;
      }

      #welcomeScreen h1 {
        font-size: 38px !important;
        line-height: 1.2;
      }

      #welcomeScreen p {
        font-size: 18px !important;
      }

      input,
      button {
        font-size: 16px !important;
      }

      video {
        height: 38vh;
        min-height: 260px;
      }

      .question-overlay {
        padding: 10px;
      }

      .question-box {
        padding: 20px;
        border-radius: 24px;
      }

      .question-box h2 {
        font-size: 24px;
        margin-bottom: 20px;
      }

      .answers {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .answers button {
        font-size: 18px;
        padding: 16px;
        border-radius: 18px;
      }

      .footer {
        padding: 16px;
      }

      .result-screen {
        padding: 50px 20px;
      }

      .result-screen h2 {
        font-size: 34px;
      }

      .result-screen p {
        font-size: 18px;
      }

      .restart-btn {
        width: 100%;
        font-size: 18px;
      }
    }

    @media(max-width: 480px) {
      .header h1 {
        font-size: 24px;
      }

      #welcomeScreen h1 {
        font-size: 32px !important;
      }

      .question-box h2 {
        font-size: 20px;
      }

      .answers button {
        font-size: 16px;
        padding: 14px;
      }

      video {
        height: 32vh;
        min-height: 220px;
      }
    }
  </style>
</head>
<body>



<div class="container">

  <div id="welcomeScreen" style="padding:60px 30px; text-align:center;">
    <h1 style="font-size:42px; margin-bottom:12px; color:#ef4444; font-weight:900; text-shadow:3px 3px 0 #ffffff;">Interactive Video Survey</h1>
    <p style="font-size:22px; color:#1e3a8a; margin-bottom:10px; font-weight:bold;">Author: Anjali Kushwaha, Gautam Buddha University</p>
    <p style="color:#374151; margin-bottom:40px; font-size:22px; font-weight:600;">Please provide your details before starting the survey.</p>

    <div style="max-width:500px; margin:0 auto; display:flex; flex-direction:column; gap:20px;">
      <input 
        type="text" 
        id="userName" 
        placeholder="😊 Enter your name"
        style="padding:16px; border-radius:14px; border:1px solid #333; background:white; color:#111827; font-size:18px; outline:none;"
      >

      <input 
        type="number" 
        id="userAge" 
        placeholder="🎂 Enter your age"
        style="padding:16px; border-radius:14px; border:1px solid #333; background:white; color:#111827; font-size:18px; outline:none;"
      >

      <label style="display:flex; align-items:flex-start; gap:12px; color:#1f2937; font-size:16px; text-align:left; background:#ffffff; padding:16px; border-radius:18px; border:4px solid #93c5fd;">
        <input type="checkbox" id="consentCheckbox" style="margin-top:4px; width:18px; height:18px; cursor:pointer;">
        <span>I voluntarily agree to participate in this survey and consent to the use of my responses for academic research purposes.</span>
      </label>

      <button 
        onclick="startSurvey()"
        style="padding:16px; border:none; border-radius:14px; background:#f43f5e; box-shadow:0 8px 0 #be123c;
        color:white; font-size:16px; font-weight:bold; cursor:pointer; transition:0.3s;"
      >
        Start Survey
      </button>
    </div>
  </div>
  <div id="mainQuiz" style="display:none;">
  <div class="header">
    <div>
      <h1>Interactive Video Survey</h1>
      <p>Author: Anjali Kushwaha, Gautam Buddha University</p>
    </div>

    <div>
      <strong id="progressText">Question 1 of 2</strong>
    </div>
  </div>

  <div id="quizContent">
    <div class="video-wrapper">
      <video id="videoPlayer" autoplay playsinline disablePictureInPicture controlsList="nodownload noplaybackrate nofullscreen" style="pointer-events:none;"></video>

      <div class="question-overlay" id="questionOverlay">
        <div class="question-box">
          <h2 id="questionText"></h2>
          <div class="answers" id="answersContainer"></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>
        <div style="color:#999; font-size:14px;">Score</div>
        <div style="font-size:30px; font-weight:bold;" id="scoreText">0</div>
      </div>

      <div class="progress-bar">
        <div class="progress" id="progressBar"></div>
      </div>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2>Survey Completed</h2>
    <p id="finalScore"></p>
    <button class="restart-btn" onclick="restartQuiz()">Restart Quiz</button>
  </div>
</div>

</div>

<script>
  const videoData = [
    {
      video: encodeURI('./WhatsApp Video 2026-05-27 at 10.11.43.mp4'),
      questions: [
        {
          question: 'Do you want this product?',
          answers: [
            'Do not want',
            'Slightly want',
            'Neutral',
            'Want',
            'Want Strongly'
          ]
        },
        {
          question: 'How many times would you ask your parents to buy this?',
          answers: [
            'Once',
            'Twice',
            'Many times',
            'Keep insisting until bought'
          ]
        }
      ]
    }
  ];

  let currentIndex = 0;
  let currentQuestionIndex = 0;
  let userName = '';
  let userAge = '';
  let score = 0;
  let responses = [];

  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQUHc5ugq1jlCRVqEyU6YRXgSDwCXeCCaMBA7yXPznWbs1MBycA4RvzcEPP-Gx2ff1xw/exec';

  const videoPlayer = document.getElementById('videoPlayer');
  const questionOverlay = document.getElementById('questionOverlay');
  const questionText = document.getElementById('questionText');
  const answersContainer = document.getElementById('answersContainer');
  const progressText = document.getElementById('progressText');
  const progressBar = document.getElementById('progressBar');
  const scoreText = document.getElementById('scoreText');
  const resultScreen = document.getElementById('resultScreen');
  const finalScore = document.getElementById('finalScore');
  const quizContent = document.getElementById('quizContent');
  
  const welcomeScreen = document.getElementById('welcomeScreen');
  const mainQuiz = document.getElementById('mainQuiz');

  function startSurvey() {
    const nameInput = document.getElementById('userName').value.trim();
    const ageInput = document.getElementById('userAge').value.trim();

    const consentChecked = document.getElementById('consentCheckbox').checked;

    if(nameInput === '' || ageInput === '') {
      alert('Please enter both name and age.');
      return;
    }

    if(!consentChecked) {
      alert('Please provide your consent before starting the survey.');
      return;
    }

    userName = nameInput;
    userAge = ageInput;

    welcomeScreen.style.display = 'none';
    mainQuiz.style.display = 'block';

    updateProgress();
    loadVideo();
  }

  function loadVideo() {
    questionOverlay.style.display = 'none';
    const current = videoData[currentIndex];

    videoPlayer.src = current.video;
    videoPlayer.currentTime = 0;
    const currentQuestion = current.questions[currentQuestionIndex];

    questionText.innerText = currentQuestion.question;

    answersContainer.innerHTML = '';

    currentQuestion.answers.forEach(answer => {
      const button = document.createElement('button');
      button.innerText = answer;

      button.onclick = () => {
        responses.push(answer);
        button.style.background = '#f59e0b';

        setTimeout(() => {
          questionOverlay.style.display = 'none';

          currentQuestionIndex++;

          if(currentQuestionIndex < current.questions.length) {
            showNextQuestion();
          } else {
            finishQuiz();
          }
        }, 1500);
      };

      answersContainer.appendChild(button);
    });

    videoPlayer.play();
  }

  

  

  videoPlayer.addEventListener('pause', () => {
    if(!videoPlayer.ended) {
      videoPlayer.play();
    }
  });

  videoPlayer.addEventListener('ended', () => {
    currentQuestionIndex = 0;
    showNextQuestion();
  });

  function showNextQuestion() {
    const current = videoData[currentIndex];
    const currentQuestion = current.questions[currentQuestionIndex];

    questionText.innerText = currentQuestion.question;
    answersContainer.innerHTML = '';

    currentQuestion.answers.forEach(answer => {
      const button = document.createElement('button');
      button.innerText = answer;

      button.onclick = () => {
        responses.push(answer);
        button.style.background = '#f59e0b';

        setTimeout(() => {
          currentQuestionIndex++;
          updateProgress();

          if(currentQuestionIndex < current.questions.length) {
            showNextQuestion();
          } else {
            finishQuiz();
          }
        }, 800);
      };

      answersContainer.appendChild(button);
    });

    questionOverlay.style.display = 'flex';
  }

  function updateProgress() {
    const totalQuestions = videoData[0].questions.length;
    const displayQuestion = Math.min(currentQuestionIndex + 1, totalQuestions);

    progressText.innerText = `Question ${displayQuestion} of ${totalQuestions}`;
    progressBar.style.width = `${(displayQuestion / totalQuestions) * 100}%`;
  }

  async function finishQuiz() {

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name: userName,
          age: userAge,
          consent: true,
          question1: responses[0] || '',
          question2: responses[1] || '',
          submittedAt: new Date().toISOString()
        })
      });
    } catch(error) {
      console.log(error);
    }

    quizContent.style.display = 'none';
    resultScreen.style.display = 'block';

    finalScore.innerText = `${userName}, age ${userAge}, thank you for completing the survey.`;
  }

  function restartQuiz() {
    responses = [];
    currentIndex = 0;
    score = 0;
    currentQuestionIndex = 0;
    scoreText.innerText = '0';

    quizContent.style.display = 'block';
    resultScreen.style.display = 'none';

    updateProgress();
    loadVideo();
  }

  </script>

</body>
</html>
