<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Video Quiz</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: #111;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      border: 1px solid #222;
    }

    .header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    .header p {
      color: #aaa;
    }

    video {
      width: 100%;
      height: 550px;
      object-fit: cover;
      background: black;
    }

    .question-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .question-box {
      background: #181818;
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 700px;
      text-align: center;
      border: 1px solid #333;
    }

    .question-box h2 {
      margin-bottom: 30px;
      font-size: 30px;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .answers button {
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: #2a2a2a;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    .answers button:hover {
      background: #444;
      transform: scale(1.03);
    }

    .footer {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-bar {
      width: 250px;
      height: 12px;
      background: #222;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: white;
      transition: width 0.5s ease;
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: 80px 20px;
    }

    .result-screen h2 {
      font-size: 50px;
      margin-bottom: 20px;
    }

    .result-screen p {
      font-size: 24px;
      color: #bbb;
      margin-bottom: 30px;
    }

    .restart-btn {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: white;
      color: black;
      font-weight: bold;
      transition: 0.3s;
    }

    .restart-btn:hover {
      transform: scale(1.05);
    }

    .video-wrapper {
      position: relative;
    }

    @media(max-width: 768px) {
      .answers {
        grid-template-columns: 1fr;
      }

      video {
        height: 300px;
      }

      .header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>Interactive Video Quiz</h1>
      <p>Watch the video and answer the question to continue.</p>
    </div>

    <div>
      <strong id="progressText">1 / 4</strong>
    </div>
  </div>

  <div id="quizContent">
    <div class="video-wrapper">
      <video id="videoPlayer" autoplay controls></video>

      <div class="question-overlay" id="questionOverlay">
        <div class="question-box">
          <h2 id="questionText"></h2>
          <div class="answers" id="answersContainer"></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>
        <div style="color:#999; font-size:14px;">Score</div>
        <div style="font-size:30px; font-weight:bold;" id="scoreText">0</div>
      </div>

      <div class="progress-bar">
        <div class="progress" id="progressBar"></div>
      </div>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2>Quiz Completed 🎉</h2>
    <p id="finalScore"></p>
    <button class="restart-btn" onclick="restartQuiz()">Restart Quiz</button>
  </div>
</div>

<script>
  const videoData = [
    {
      video: 'https://www.w3schools.com/html/mov_bbb.mp4',
      question: 'What color was the main object shown in the video?',
      answers: ['Blue', 'Red', 'Green', 'Yellow'],
      correct: 'Blue'
    },
    {
      video: 'https://www.w3schools.com/html/movie.mp4',
      question: 'What type of video was this?',
      answers: ['Nature', 'Animation', 'Tutorial', 'Sports'],
      correct: 'Nature'
    },
    {
      video: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
      question: 'What was shown in this video?',
      answers: ['Cars', 'Flowers', 'Animals', 'Ocean'],
      correct: 'Flowers'
    },
    {
      video: 'https://www.w3schools.com/html/mov_bbb.mp4',
      question: 'Did you enjoy the interactive experience?',
      answers: ['Yes', 'No', 'Maybe', 'Not Sure'],
      correct: 'Yes'
    }
  ];

  let currentIndex = 0;
  let score = 0;

  const videoPlayer = document.getElementById('videoPlayer');
  const questionOverlay = document.getElementById('questionOverlay');
  const questionText = document.getElementById('questionText');
  const answersContainer = document.getElementById('answersContainer');
  const progressText = document.getElementById('progressText');
  const progressBar = document.getElementById('progressBar');
  const scoreText = document.getElementById('scoreText');
  const resultScreen = document.getElementById('resultScreen');
  const finalScore = document.getElementById('finalScore');
  const quizContent = document.getElementById('quizContent');

  function loadVideo() {
    const current = videoData[currentIndex];

    videoPlayer.src = current.video;
    questionText.innerText = current.question;

    answersContainer.innerHTML = '';

    current.answers.forEach(answer => {
      const button = document.createElement('button');
      button.innerText = answer;

      button.onclick = () => {
        if(answer === current.correct) {
          score++;
          scoreText.innerText = score;
          button.style.background = 'green';
        } else {
          button.style.background = 'red';
        }

        setTimeout(() => {
          questionOverlay.style.display = 'none';

          currentIndex++;

          if(currentIndex < videoData.length) {
            updateProgress();
            loadVideo();
          } else {
            finishQuiz();
          }
        }, 1500);
      };

      answersContainer.appendChild(button);
    });

    videoPlayer.play();
  }

  videoPlayer.addEventListener('ended', () => {
    questionOverlay.style.display = 'flex';
  });

  function updateProgress() {
    progressText.innerText = `${Math.min(currentIndex + 1, 4)} / 4`;
    progressBar.style.width = `${((currentIndex + 1) / 4) * 100}%`;
  }

  function finishQuiz() {
    quizContent.style.display = 'none';
    resultScreen.style.display = 'block';
    finalScore.innerText = `You scored ${score} out of 4.`;
  }

  function restartQuiz() {
    currentIndex = 0;
    score = 0;
    scoreText.innerText = '0';

    quizContent.style.display = 'block';
    resultScreen.style.display = 'none';

    updateProgress();
    loadVideo();
  }

  updateProgress();
  loadVideo();
</script>

</body>
</html>
