<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Children Ad Recall Survey</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -30px); }
    }
    .animate-drift { animation: drift 20s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- BG DECOR -->
  <div class="fixed inset-0 -z-10 bg-slate-100">
    <div class="absolute top-0 left-0 w-96 h-96 bg-orange-100/50 blur-3xl animate-drift"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-blue-100/50 blur-3xl animate-drift" style="animation-delay: -5s"></div>
  </div>

  <button onclick="toggleAdminPanel()" class="fixed top-4 right-4 bg-white shadow-md p-2 rounded-full z-50 hover:scale-110 transition-transform">
    <i data-lucide="settings" class="w-5 h-5 text-slate-600"></i>
  </button>

  <header class="w-full h-16 bg-orange-500 text-white flex items-center justify-between px-8 shadow-lg z-30">
    <span class="font-black uppercase tracking-tighter text-lg">Ad Research Portal</span>
    <span id="header-count" class="bg-orange-600 px-3 py-1 rounded-full text-xs font-bold">Records: 0</span>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    
    <!-- STAGE: DEMOGRAPHICS -->
    <div id="stage-demo" class="w-full max-w-xl bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
      <div class="bg-orange-500 p-8 text-white text-center">
        <h1 class="text-2xl font-bold font-display uppercase">Participant Info</h1>
        <p class="text-orange-100 text-sm">Please enter details to start the survey</p>
      </div>
      <form onsubmit="startSurvey(event)" class="p-8 space-y-5">
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Full Name</label>
          <input type="text" id="p-name" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Age</label>
            <select id="p-age" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl">
               <option value="">Select...</option>
               <script>for(let i=4; i<=18; i++) document.write(`<option value="${i}">${i}</option>`)</script>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Class</label>
            <input type="text" id="p-class" placeholder="e.g. Grade 5" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl">
          </div>
        </div>
        <button type="submit" class="w-full bg-orange-500 text-white font-bold py-4 rounded-xl uppercase tracking-widest shadow-lg hover:bg-orange-600 transition-colors">Start Session</button>
      </form>
    </div>

    <!-- STAGE: VIDEO -->
    <div id="stage-video" class="hidden w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden">
      <div class="bg-slate-800 p-4 text-white flex justify-between items-center">
        <span id="vid-step" class="text-xs font-bold uppercase">Ad 1 of 4</span>
        <span id="vid-title" class="text-xs font-medium opacity-70">Video Title</span>
      </div>
      <div class="aspect-video bg-black relative">
        <video id="main-player" onended="onVideoEnd()" class="w-full h-full"></video>
        <div id="video-overlay" class="absolute inset-0 bg-black/60 flex items-center justify-center cursor-pointer" onclick="playVideo()">
          <div class="w-20 h-20 bg-orange-500 rounded-full flex items-center justify-center text-white"><i data-lucide="play" class="fill-current ml-1"></i></div>
        </div>
      </div>
      <div class="p-6">
        <button id="btn-next-vid" disabled onclick="nextVid()" class="w-full bg-slate-200 text-slate-400 font-bold py-4 rounded-xl uppercase transition-all">Watch Full Video to Continue</button>
      </div>
    </div>

    <!-- STAGE: QUESTIONS -->
    <div id="stage-questions" class="hidden w-full max-w-3xl bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
      <div class="p-8 border-b">
        <div class="flex justify-between items-center mb-4">
          <span id="q-cat" class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-[10px] font-bold uppercase">Category</span>
          <span id="q-progress" class="text-slate-400 text-xs font-bold">1 / 30</span>
        </div>
        <h2 id="q-text" class="text-2xl font-semibold text-slate-800 leading-tight">Question text goes here?</h2>
      </div>
      <div class="p-10">
        <div class="grid grid-cols-5 gap-3">
          <script>
            const labels = ["Strongly Disagree", "Disagree", "Neutral", "Agree", "Strongly Agree"];
            for(let i=1; i<=5; i++) {
              document.write(`
                <button onclick="setRating(${i})" class="group flex flex-col items-center gap-3">
                  <div id="l-box-${i}" class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl border-2 border-slate-100 flex items-center justify-center text-xl font-bold text-slate-300 transition-all">
                    ${i}
                  </div>
                  <span class="text-[8px] font-bold uppercase text-slate-400 text-center">${labels[i-1]}</span>
                </button>
              `);
            }
          </script>
        </div>
      </div>
      <div class="bg-slate-50 p-6 flex justify-between">
        <button onclick="prevQ()" class="px-8 py-3 rounded-xl border font-bold text-slate-400 hover:bg-white transition-colors">Back</button>
        <button id="btn-next-q" onclick="nextQ()" class="px-10 py-3 rounded-xl bg-orange-500 text-white font-bold shadow-md hover:bg-orange-600 transition-colors">Next</button>
      </div>
    </div>

    <!-- STAGE: END -->
    <div id="stage-end" class="hidden text-center bg-white p-12 rounded-3xl shadow-xl max-w-sm w-full">
      <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="check" class="w-10 h-10"></i></div>
      <h2 class="text-2xl font-bold uppercase mb-2">Success!</h2>
      <p class="text-slate-500 text-sm mb-8">Thank you. Your data has been recorded.</p>
      <button onclick="location.reload()" class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold uppercase">Finish</button>
    </div>

  </main>

  <!-- ADMIN PANEL -->
  <div id="admin-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl">
      <div class="bg-slate-800 p-4 text-white flex justify-between items-center">
        <span class="font-bold uppercase text-xs">Researcher Dashboard</span>
        <button onclick="toggleAdminPanel()"><i data-lucide="x"></i></button>
      </div>
      <div class="p-6 space-y-6">
        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Google Sheets Endpoint</label>
          <input type="text" id="script-url" class="w-full border p-3 rounded-xl text-xs" placeholder="https://script.google.com/...">
          <button onclick="saveConfig()" class="mt-2 bg-orange-500 text-white px-4 py-2 rounded-lg text-[10px] font-bold uppercase">Save Configuration</button>
        </div>
        <div class="border-t pt-4">
          <div class="flex justify-between items-center mb-4">
             <h3 class="text-xs font-black uppercase">Stored Responses</h3>
             <button onclick="exportData()" class="text-emerald-600 text-[10px] font-bold uppercase border border-emerald-600 px-2 py-1 rounded">Export CSV</button>
          </div>
          <div class="max-h-40 overflow-y-auto text-[10px] border rounded-xl" id="log-container"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // THE 30 QUESTIONS
    const SURVEY_QUESTIONS = [
      { id: "AR1", cat: "Recall", text: "I watched all the advertisements carefully." },
      { id: "AR2", cat: "Recall", text: "I can remember all the products shown in the advertisements." },
      { id: "AR3", cat: "Recall", text: "The advertisements were interesting." },
      { id: "AR4", cat: "Recall", text: "I liked the way the advertisements looked." },
      { id: "AR5", cat: "Recall", text: "I would like to watch the advertisements again." },
      { id: "ER1", cat: "Emotional", text: "The advertisements made me happy." },
      { id: "ER2", cat: "Emotional", text: "The advertisements were exciting." },
      { id: "ER3", cat: "Emotional", text: "I felt emotionally connected to the advertisements." },
      { id: "ER4", cat: "Emotional", text: "The advertisements made the products look fun." },
      { id: "CE1", cat: "Celebrity", text: "I liked the celebrity in the advertisement." },
      { id: "CE2", cat: "Celebrity", text: "The celebrity made the product more attractive." },
      { id: "CE3", cat: "Celebrity", text: "I trust products shown by famous people." },
      { id: "CE4", cat: "Celebrity", text: "I would like to use products used by the celebrity." },
      { id: "CC1", cat: "Cartoon", text: "I liked the cartoon character in the advertisement." },
      { id: "CC2", cat: "Cartoon", text: "The cartoon character made the product more attractive." },
      { id: "CC3", cat: "Cartoon", text: "I trust products shown by cartoon characters." },
      { id: "CC4", cat: "Cartoon", text: "I would like to use products used by the cartoon character." },
      { id: "PD1", cat: "Purchase", text: "I want this product." },
      { id: "PD2", cat: "Purchase", text: "I would like my parents to buy this product for me." },
      { id: "PD3", cat: "Purchase", text: "I may ask my parents to buy this product." },
      { id: "PD4", cat: "Purchase", text: "I think this product is better than other products." },
      { id: "PD5", cat: "Purchase", text: "I would feel happy if I got this product." },
      { id: "PP1", cat: "Pestering", text: "I will ask my parents to buy this product many times." },
      { id: "PP2", cat: "Pestering", text: "I will remind my parents again if they refuse." },
      { id: "PP3", cat: "Pestering", text: "I may feel upset if my parents do not buy this product." },
      { id: "PP4", cat: "Pestering", text: "I may compare this product with what my friends have." },
      { id: "PP5", cat: "Pestering", text: "I will try hard to convince my parents to buy this product." },
      { id: "PI1", cat: "Peer", text: "My friends influence what products I like." },
      { id: "PI2", cat: "Peer", text: "I want products that my friends have." },
      { id: "PI3", cat: "Peer", text: "I feel left out if I do not have products like my friends." }
    ];

    const VIDEOS = [
      { title: "Big Babool Crow", url: "https://raw.githubusercontent.com/dranjalikushwaha/ad-influence-game/main/Big%20babool%20crow%20ad.mp4" },
      { title: "Boost Play Bigger", url: "https://raw.githubusercontent.com/dranjalikushwaha/ad-influence-game/main/vidssave.com%20Boost%20%23PlayABiggerGame%202018%20720P.mp4" },
      { title: "Kelloggs Chocos", url: "https://raw.githubusercontent.com/dranjalikushwaha/ad-influence-game/main/vidssave.com%20Kellogg%E2%80%99s%20Multigrain%20Chocos%20_%20Multigrain%20Energy%2C%20More%20Chocolatey%20_%20Hindi%2030%20sec%201080P.mp4" },
      { title: "Kissan Jam", url: "https://raw.githubusercontent.com/dranjalikushwaha/ad-influence-game/main/vidssave.com%20Kissan%20Jam%20(Hindi)%20720P.mp4" }
    ];

    let currentStage = 'demo';
    let pInfo = {};
    let videoIndex = 0;
    let questionIndex = 0;
    let answers = {};
    let sheetUrl = localStorage.getItem('survey_url') || '';

    window.onload = () => { lucide.createIcons(); updateStats(); document.getElementById('script-url').value = sheetUrl; };

    function startSurvey(e) {
      e.preventDefault();
      pInfo = { name: document.getElementById('p-name').value, age: document.getElementById('p-age').value, class: document.getElementById('p-class').value };
      showStage('video');
      loadVid();
    }

    function loadVid() {
      const v = VIDEOS[videoIndex];
      const player = document.getElementById('main-player');
      document.getElementById('vid-step').innerText = `Ad ${videoIndex + 1} of 4`;
      document.getElementById('vid-title').innerText = v.title;
      player.src = v.url;
      player.load();
      document.getElementById('video-overlay').classList.remove('hidden');
      const btn = document.getElementById('btn-next-vid');
      btn.disabled = true;
      btn.className = "w-full bg-slate-200 text-slate-400 font-bold py-4 rounded-xl uppercase";
      btn.innerText = "Watch Full Video to Continue";
    }

    function playVideo() { document.getElementById('main-player').play(); document.getElementById('video-overlay').classList.add('hidden'); }

    function onVideoEnd() {
      const btn = document.getElementById('btn-next-vid');
      btn.disabled = false;
      btn.className = "w-full bg-orange-500 text-white font-bold py-4 rounded-xl uppercase shadow-lg";
      btn.innerText = videoIndex < 3 ? "Next Advertisement" : "Go to Questions";
    }

    function nextVid() {
      if(videoIndex < 3) { videoIndex++; loadVid(); } 
      else { showStage('questions'); loadQ(); }
    }

    function loadQ() {
      const q = SURVEY_QUESTIONS[questionIndex];
      document.getElementById('q-cat').innerText = q.cat;
      document.getElementById('q-text').innerText = q.text;
      document.getElementById('q-progress').innerText = `${questionIndex + 1} / 30`;
      document.getElementById('btn-next-q').innerText = questionIndex === 29 ? "Submit" : "Next";
      updateLikertUI(answers[q.id]);
    }

    function setRating(v) {
      answers[SURVEY_QUESTIONS[questionIndex].id] = v;
      updateLikertUI(v);
      setTimeout(() => { if(questionIndex < 29) { questionIndex++; loadQ(); } }, 200);
    }

    function updateLikertUI(val) {
      for(let i=1; i<=5; i++) {
        const b = document.getElementById(`l-box-${i}`);
        if(i === val) b.className = "w-14 h-14 sm:w-16 sm:h-16 rounded-2xl border-4 border-orange-500 bg-orange-50 flex items-center justify-center text-xl font-bold text-orange-600 scale-110";
        else b.className = "w-14 h-14 sm:w-16 sm:h-16 rounded-2xl border-2 border-slate-100 flex items-center justify-center text-xl font-bold text-slate-300";
      }
    }

    function nextQ() {
      if(!answers[SURVEY_QUESTIONS[questionIndex].id]) return alert("Select an answer");
      if(questionIndex < 29) { questionIndex++; loadQ(); } 
      else { finalize(); }
    }

    function prevQ() { if(questionIndex > 0) { questionIndex--; loadQ(); } }

    async function finalize() {
      const result = { ...pInfo, ...answers, timestamp: new Date().toLocaleString() };
      let logs = JSON.parse(localStorage.getItem('survey_logs') || "[]");
      logs.push(result);
      localStorage.setItem('survey_logs', JSON.stringify(logs));
      
      if(sheetUrl) fetch(sheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(result) });
      showStage('end');
    }

    function showStage(s) {
      ['stage-demo', 'stage-video', 'stage-questions', 'stage-end'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById(`stage-${s}`).classList.remove('hidden');
    }

    function toggleAdminPanel() { 
      document.getElementById('admin-modal').classList.toggle('hidden');
      const logs = JSON.parse(localStorage.getItem('survey_logs') || "[]");
      document.getElementById('log-container').innerHTML = logs.map(l => `<div class="p-2 border-b">${l.name} - ${l.timestamp}</div>`).join('');
    }

    function saveConfig() { sheetUrl = document.getElementById('script-url').value; localStorage.setItem('survey_url', sheetUrl); alert("Saved"); }

    function exportData() {
      const logs = JSON.parse(localStorage.getItem('survey_logs') || "[]");
      if(!logs.length) return alert("No data");
      let csv = Object.keys(logs[0]).join(",") + "\n";
      logs.forEach(l => csv += Object.values(l).join(",") + "\n");
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'results.csv';
      a.click();
    }

    function updateStats() {
      const logs = JSON.parse(localStorage.getItem('survey_logs') || "[]");
      document.getElementById('header-count').innerText = `Records: ${logs.length}`;
    }
  </script>
</body>
</html>
