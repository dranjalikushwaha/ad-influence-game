<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Recall Research Survey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- Admin/Settings Access -->
  <button onclick="toggleAdminPanel()" class="fixed top-4 right-4 bg-white shadow-md p-2 rounded-full z-50 hover:scale-110 transition-transform">
    <i data-lucide="settings" class="w-5 h-5 text-slate-600"></i>
  </button>

  <header class="w-full h-16 bg-orange-500 text-white flex items-center justify-between px-8 shadow-lg z-30">
    <span class="font-black uppercase tracking-tighter text-lg">Research Portal</span>
    <span id="header-count" class="bg-orange-600 px-3 py-1 rounded-full text-xs font-bold">Records: 0</span>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    
    <!-- STAGE: DEMOGRAPHICS (D1-D6) -->
    <div id="stage-demo" class="w-full max-w-xl bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
      <div class="bg-orange-500 p-8 text-white text-center">
        <h1 class="text-2xl font-bold font-display uppercase">Participant Details</h1>
        <p class="text-orange-100 text-sm">All information is kept confidential</p>
      </div>
      <form onsubmit="startSurvey(event)" class="p-8 space-y-4">
        <div>
          <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">D1. Full Name</label>
          <input type="text" id="p-name" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl outline-none focus:ring-2 focus:ring-orange-500">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">D2. Age</label>
            <select id="p-age" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl">
               <option value="">Select...</option>
               <script>for(let i=4; i<=18; i++) document.write(`<option value="${i}">${i}</option>`)</script>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">D3. Gender</label>
            <select id="p-gender" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl">
               <option value="">Select...</option>
               <option value="Male">Male</option>
               <option value="Female">Female</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">D4. School Type</label>
            <select id="p-school" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl">
               <option value="">Select...</option>
               <option value="Private">Private</option>
               <option value="Government">Government</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">D5. Siblings</label>
            <input type="number" id="p-siblings" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">D6. Class</label>
            <input type="text" id="p-class" required placeholder="e.g. Grade 5" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl">
          </div>
          <div>
            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">D7. Daily Screen Time</label>
            <select id="p-screen" required class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl">
               <option value="">Select...</option>
               <option value="<1 hour">Less than 1 hour</option>
               <option value="1-2 hours">1-2 hours</option>
               <option value="2-3 hours">2-3 hours</option>
               <option value="3+ hours">More than 3 hours</option>
            </select>
          </div>
        </div>
        <button type="submit" class="w-full bg-orange-500 text-white font-bold py-4 rounded-xl uppercase tracking-widest shadow-lg hover:bg-orange-600 transition-colors">Begin Survey</button>
      </form>
    </div>

    <!-- STAGE: VIDEO -->
    <div id="stage-video" class="hidden w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden">
      <div class="bg-slate-800 p-4 text-white flex justify-between items-center">
        <span id="vid-step" class="text-xs font-bold uppercase">Ad 1 of 4</span>
        <span id="vid-title" class="text-xs font-medium opacity-70">Video</span>
      </div>
      <div class="aspect-video bg-black relative">
        <video id="main-player" onended="onVideoEnd()" class="w-full h-full"></video>
        <div id="video-overlay" class="absolute inset-0 bg-black/60 flex items-center justify-center cursor-pointer" onclick="playVideo()">
          <div class="w-20 h-20 bg-orange-500 rounded-full flex items-center justify-center text-white"><i data-lucide="play" class="fill-current ml-1"></i></div>
        </div>
      </div>
      <div class="p-6">
        <button id="btn-next-vid" disabled onclick="nextVid()" class="w-full bg-slate-200 text-slate-400 font-bold py-4 rounded-xl uppercase transition-all">Watch video to proceed</button>
      </div>
    </div>

    <!-- STAGE: QUESTIONS (AR1 to PI3) -->
    <div id="stage-questions" class="hidden w-full max-w-3xl bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
      <div class="p-8 border-b">
        <div class="flex justify-between items-center mb-4">
          <span id="q-cat" class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-[10px] font-bold uppercase">Category</span>
          <span id="q-progress" class="text-slate-400 text-xs font-bold">1 / 22</span>
        </div>
        <h2 id="q-text" class="text-2xl font-semibold text-slate-800 leading-tight">Question text?</h2>
      </div>
      <div class="p-10">
        <div class="grid grid-cols-5 gap-3">
          <script>
            const lbls = ["Strongly Disagree", "Disagree", "Neutral", "Agree", "Strongly Agree"];
            for(let i=1; i<=5; i++) {
              document.write(`
                <button onclick="setRating(${i})" class="group flex flex-col items-center gap-3">
                  <div id="l-box-${i}" class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl border-2 border-slate-100 flex items-center justify-center text-xl font-bold text-slate-300 transition-all">${i}</div>
                  <span class="text-[8px] font-bold uppercase text-slate-400 text-center">${lbls[i-1]}</span>
                </button>
              `);
            }
          </script>
        </div>
      </div>
      <div class="bg-slate-50 p-6 flex justify-between">
        <button onclick="prevQ()" class="px-8 py-3 rounded-xl border font-bold text-slate-400 hover:bg-white transition-colors">Back</button>
        <button id="btn-next-q" onclick="nextQ()" class="px-10 py-3 rounded-xl bg-orange-500 text-white font-bold shadow-md hover:bg-orange-600 transition-colors">Next</button>
      </div>
    </div>

    <!-- STAGE: END -->
    <div id="stage-end" class="hidden text-center bg-white p-12 rounded-3xl shadow-xl max-w-sm w-full">
      <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="check" class="w-10 h-10"></i></div>
      <h2 class="text-2xl font-bold uppercase mb-2">Complete</h2>
      <p class="text-slate-500 text-sm mb-8">Data recorded successfully.</p>
      <button onclick="location.reload()" class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold uppercase">New Entry</button>
    </div>

  </main>

  <script>
    const SURVEY_QUESTIONS = [
      { id: "AR1", cat: "Attitude toward Advertisement", text: "I watched all the advertisement carefully." },
      { id: "AR2", cat: "Attitude toward Advertisement", text: "I can remember all the products shown in the advertisement." },
      { id: "AR3", cat: "Attitude toward Advertisement", text: "The advertisement was most interesting." },
      { id: "AR4", cat: "Attitude toward Advertisement", text: "I liked the way the advertisement looked." },
      { id: "AR5", cat: "Attitude toward Advertisement", text: "I would like to watch the advertisement again." },
      { id: "ER1", cat: "Emotional Reaction", text: "The advertisement made me happy." },
      { id: "ER2", cat: "Emotional Reaction", text: "The advertisement was exciting." },
      { id: "ER3", cat: "Emotional Reaction", text: "I felt emotionally connected to the advertisement." },
      { id: "ER4", cat: "Emotional Reaction", text: "The advertisement made the product look fun." },
      { id: "PD1", cat: "Purchase Intention", text: "I want this product." },
      { id: "PD2", cat: "Purchase Intention", text: "I would like my parents to buy this product for me." },
      { id: "PD3", cat: "Purchase Intention", text: "I may ask my parents to buy this product." },
      { id: "PD4", cat: "Purchase Intention", text: "I think this product is better than other products." },
      { id: "PD5", cat: "Purchase Intention", text: "I would feel happy if I got this product." },
      { id: "PP1", cat: "Child Influence Attempts", text: "I will ask my parents to buy this product many times." },
      { id: "PP2", cat: "Child Influence Attempts", text: "I will remind my parents again if they refuse." },
      { id: "PP3", cat: "Child Influence Attempts", text: "I may feel upset if my parents do not buy this product." },
      { id: "PP4", cat: "Child Influence Attempts", text: "I may compare this product with what my friends have." },
      { id: "PP5", cat: "Child Influence Attempts", text: "I will try hard to convince my parents to buy this product." },
      { id: "PI1", cat: "Peer Influence", text: "My friends influence what products I like." },
      { id: "PI2", cat: "Peer Influence", text: "I want products that my friends have." },
      { id: "PI3", cat: "Peer Influence", text: "I feel left out if I do not have products like my friends." }
    ];

    const VIDEOS = [
      { title: "Big Babool Crow", url: "https://raw.githubusercontent.com/dranjalikushwaha/ad-influence-game/main/Big%20babool%20crow%20ad.mp4" },
      { title: "Boost Play Bigger", url: "https://raw.githubusercontent.com/dranjalikushwaha/ad-influence-game/main/vidssave.com%20Boost%20%23PlayABiggerGame%202018%20720P.mp4" },
      { title: "Kelloggs Chocos", url: "https://raw.githubusercontent.com/dranjalikushwaha/ad-influence-game/main/vidssave.com%20Kellogg%E2%80%99s%20Multigrain%20Chocos%20_%20Multigrain%20Energy%2C%20More%20Chocolatey%20_%20Hindi%2030%20sec%201080P.mp4" },
      { title: "Kissan Jam", url: "https://raw.githubusercontent.com/dranjalikushwaha/ad-influence-game/main/vidssave.com%20Kissan%20Jam%20(Hindi)%20720P.mp4" }
    ];

    let pInfo = {};
    let videoIndex = 0;
    let questionIndex = 0;
    let answers = {};
    let sheetUrl = localStorage.getItem('survey_url') || '';

    window.onload = () => { lucide.createIcons(); updateStats(); };

    function startSurvey(e) {
      e.preventDefault();
      pInfo = { 
        name: document.getElementById('p-name').value, 
        age: document.getElementById('p-age').value, 
        gender: document.getElementById('p-gender').value,
        school: document.getElementById('p-school').value,
        siblings: document.getElementById('p-siblings').value,
        class: document.getElementById('p-class').value,
        screenTime: document.getElementById('p-screen').value
      };
      showStage('video');
      loadVid();
    }

    function loadVid() {
      const v = VIDEOS[videoIndex];
      const player = document.getElementById('main-player');
      document.getElementById('vid-step').innerText = `Ad ${videoIndex + 1} of 4`;
      document.getElementById('vid-title').innerText = v.title;
      player.src = v.url;
      player.load();
      document.getElementById('video-overlay').classList.remove('hidden');
      const btn = document.getElementById('btn-next-vid');
      btn.disabled = true;
      btn.innerText = "Watch video to proceed";
    }

    function playVideo() { document.getElementById('main-player').play(); document.getElementById('video-overlay').classList.add('hidden'); }
    function onVideoEnd() { document.getElementById('btn-next-vid').disabled = false; document.getElementById('btn-next-vid').innerText = "Continue"; }

    function nextVid() {
      if(videoIndex < 3) { videoIndex++; loadVid(); } 
      else { showStage('questions'); loadQ(); }
    }

    function loadQ() {
      const q = SURVEY_QUESTIONS[questionIndex];
      document.getElementById('q-cat').innerText = q.cat;
      document.getElementById('q-text').innerText = q.text;
      document.getElementById('q-progress').innerText = `${questionIndex + 1} / 22`;
      document.getElementById('btn-next-q').innerText = questionIndex === 21 ? "Submit" : "Next";
      updateLikertUI(answers[q.id]);
    }

    function setRating(v) {
      answers[SURVEY_QUESTIONS[questionIndex].id] = v;
      updateLikertUI(v);
      setTimeout(() => { if(questionIndex < 21) { questionIndex++; loadQ(); } }, 200);
    }

    function updateLikertUI(val) {
      for(let i=1; i<=5; i++) {
        const b = document.getElementById(`l-box-${i}`);
        b.className = (i === val) ? "w-14 h-14 sm:w-16 sm:h-16 rounded-2xl border-4 border-orange-500 bg-orange-50 flex items-center justify-center text-xl font-bold text-orange-600 scale-110" : "w-14 h-14 sm:w-16 sm:h-16 rounded-2xl border-2 border-slate-100 flex items-center justify-center text-xl font-bold text-slate-300";
      }
    }

    function nextQ() {
      if(!answers[SURVEY_QUESTIONS[questionIndex].id]) return alert("Select an answer");
      if(questionIndex < 21) { questionIndex++; loadQ(); } 
      else { finalize(); }
    }

    function prevQ() { if(questionIndex > 0) { questionIndex--; loadQ(); } }

    async function finalize() {
      const result = { ...pInfo, ...answers, timestamp: new Date().toLocaleString() };
      let logs = JSON.parse(localStorage.getItem('survey_logs') || "[]");
      logs.push(result);
      localStorage.setItem('survey_logs', JSON.stringify(logs));
      if(sheetUrl) fetch(sheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(result) });
      showStage('end');
      updateStats();
    }

    function showStage(s) {
      ['stage-demo', 'stage-video', 'stage-questions', 'stage-end'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById(`stage-${s}`).classList.remove('hidden');
    }

    function toggleAdminPanel() { alert("Admin panel logic simplified for single file. Settings would go here."); }
    function updateStats() {
      const logs = JSON.parse(localStorage.getItem('survey_logs') || "[]");
      document.getElementById('header-count').innerText = `Records: ${logs.length}`;
    }
  </script>
</body>
</html>
