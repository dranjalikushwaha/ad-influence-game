<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ad Influence Study</title>
  <style>
    :root {
      --bg: #f3efe4;
      --paper: #fffdf8;
      --ink: #1e2432;
      --muted: #6b7280;
      --line: #dfd6c0;
      --accent: #bf5b39;
      --accent-dark: #8f3c20;
      --accent-soft: #f8e0d5;
      --card: #ffffff;
      --shadow: 0 22px 44px rgba(45, 34, 18, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(191, 91, 57, 0.12), transparent 28%),
        linear-gradient(180deg, #efe6d4 0%, var(--bg) 100%);
    }

    .app {
      width: min(960px, calc(100% - 32px));
      margin: 28px auto;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 0;
      max-width: 560px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .badge {
      flex-shrink: 0;
      border: 1px solid rgba(30, 36, 50, 0.12);
      border-radius: 999px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.75);
      font-size: 0.92rem;
      color: var(--muted);
    }

    .sheet {
      position: relative;
      background:
        repeating-linear-gradient(
          180deg,
          var(--paper) 0,
          var(--paper) 38px,
          var(--line) 39px,
          var(--paper) 40px
        );
      border-radius: 28px;
      padding: 34px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sheet::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 34px;
      width: 2px;
      background: rgba(191, 91, 57, 0.28);
    }

    .content {
      position: relative;
      z-index: 1;
      padding-left: 26px;
      min-height: 620px;
    }

    .step-label {
      margin: 0 0 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.76rem;
      color: var(--accent-dark);
      font-weight: 700;
    }

    h2 {
      margin: 0 0 14px;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      line-height: 1.05;
    }

    .lede {
      margin: 0 0 24px;
      color: var(--muted);
      max-width: 640px;
      line-height: 1.6;
    }

    .button-row,
    .option-grid {
      display: grid;
      gap: 14px;
    }

    .button-row {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      margin-top: 26px;
      max-width: 560px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 18px;
      padding: 16px 18px;
      cursor: pointer;
      font: inherit;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .primary {
      background: var(--accent);
      color: #fff8f3;
      box-shadow: 0 14px 28px rgba(191, 91, 57, 0.22);
    }

    .secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid rgba(30, 36, 50, 0.12);
    }

    .ghost {
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink);
      border: 1px dashed rgba(30, 36, 50, 0.16);
    }

    .flow-card {
      display: grid;
      gap: 22px;
      align-items: start;
      grid-template-columns: 1.15fr 0.85fr;
    }

    .ad-panel {
      background: linear-gradient(180deg, #fff8f0 0%, #ffffff 100%);
      border: 1px solid rgba(30, 36, 50, 0.08);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(45, 34, 18, 0.08);
    }

    .ad-topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 7px 12px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .ad-visual {
      min-height: 250px;
      border-radius: 24px;
      padding: 24px;
      display: grid;
      place-items: center;
      text-align: center;
      color: white;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .ad-emoji {
      font-size: clamp(4rem, 9vw, 6rem);
      line-height: 1;
      margin-bottom: 12px;
      display: block;
    }

    .ad-title {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1;
    }

    .ad-copy {
      margin: 0;
      font-size: 1.02rem;
      line-height: 1.6;
      max-width: 26ch;
      opacity: 0.96;
    }

    .ad-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .price {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .side-panel {
      display: grid;
      gap: 18px;
    }

    .note,
    .question-card,
    .summary-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(30, 36, 50, 0.08);
      border-radius: 22px;
      padding: 20px;
    }

    .note strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .note p,
    .question-card p,
    .summary-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .question-card h3,
    .summary-card h3 {
      margin: 0 0 12px;
      font-size: 1.12rem;
    }

    .option-grid {
      margin-top: 16px;
    }

    .rating-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .text-grid {
      grid-template-columns: 1fr;
    }

    .option {
      background: #fff;
      border: 1px solid rgba(30, 36, 50, 0.12);
      text-align: left;
      min-height: 78px;
    }

    .option strong {
      display: block;
      font-size: 1.15rem;
      margin-bottom: 4px;
      color: var(--ink);
    }

    .option span {
      display: block;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .stepper {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(30, 36, 50, 0.12);
    }

    .dot.active,
    .dot.done {
      background: var(--accent);
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 26px 0;
    }

    .results strong {
      display: block;
      margin-bottom: 10px;
      font-size: 1.04rem;
    }

    .results ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.65;
    }

    .results li + li {
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 820px) {
      .hero {
        flex-direction: column;
      }

      .sheet {
        padding: 24px 18px;
      }

      .sheet::before {
        left: 22px;
      }

      .content {
        padding-left: 18px;
        min-height: auto;
      }

      .flow-card {
        grid-template-columns: 1fr;
      }

      .rating-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <h1>Advertisement Influence Study</h1>
        <p>A simple interactive prototype based on your sketch: participant consent, ad exposure, product desire rating, and the follow-up question about asking parents to buy the item.</p>
      </div>
      <div class="badge" id="progressBadge">Intro</div>
    </header>

    <main class="sheet">
      <div class="content" id="screen"></div>
    </main>
  </div>

  <script>
    const ads = [
      {
        id: "toy",
        category: "Toy",
        product: "Rocket Robo",
        emoji: "🤖",
        price: "$30",
        headline: "Your new best play buddy.",
        copy: "Rocket Robo lights up, talks back, and turns every room into an adventure zone.",
        theme: "linear-gradient(145deg, #ff7b54 0%, #ffb26b 55%, #ffdb99 100%)"
      },
      {
        id: "snack",
        category: "Snack",
        product: "Crunch Burst",
        emoji: "🍿",
        price: "$5",
        headline: "Snack time just got louder.",
        copy: "Crunch Burst brings the fun with bold flavor, bright colors, and that one-more-pack feeling.",
        theme: "linear-gradient(145deg, #ef476f 0%, #ff7f50 52%, #ffd166 100%)"
      },
      {
        id: "educational",
        category: "Educational",
        product: "Brain Builder Kit",
        emoji: "🧠",
        price: "$18",
        headline: "Learn, build, and win.",
        copy: "A hands-on kit packed with puzzles, mini challenges, and exciting science tricks for curious kids.",
        theme: "linear-gradient(145deg, #118ab2 0%, #2a9d8f 50%, #9ad1d4 100%)"
      },
      {
        id: "apparel",
        category: "Apparel",
        product: "StarSprint Sneakers",
        emoji: "👟",
        price: "$42",
        headline: "Run fast. Look faster.",
        copy: "Color-pop sneakers made to stand out in the playground, hallway, and every photo after school.",
        theme: "linear-gradient(145deg, #6a4c93 0%, #8ac926 52%, #c8f169 100%)"
      }
    ];

    const desireLabels = {
      1: "Do not want",
      2: "Want a little",
      3: "Maybe want",
      4: "Want a lot",
      5: "Want strongly"
    };

    const pesteringOptions = [
      { value: "once", label: "Once", description: "Ask one time only." },
      { value: "twice", label: "Twice", description: "Ask again after the first try." },
      { value: "many-times", label: "Many times", description: "Bring it up repeatedly." },
      { value: "until-bought", label: "Keep insisting until bought", description: "Continue asking until parents agree." }
    ];

    const state = {
      consent: null,
      screen: "consent",
      adIndex: 0,
      currentDesire: null,
      results: []
    };

    function updateProgress(label) {
      document.getElementById("progressBadge").textContent = label;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderConsent() {
      updateProgress("Consent");
      return `
        <p class="step-label">Participant Step</p>
        <h2>Do you agree to participate?</h2>
        <p class="lede">This matches the first branch in your sketch. If the participant agrees, the study begins. If not, the flow ends politely.</p>
        <div class="button-row">
          <button class="primary" onclick="setConsent(true)">P1: Agree</button>
          <button class="secondary" onclick="setConsent(false)">P2: Not Agree</button>
        </div>
      `;
    }

    function renderDeclined() {
      updateProgress("Closed");
      return `
        <p class="step-label">Exit</p>
        <h2>Participation not accepted</h2>
        <p class="lede">The participant selected <strong>Not Agree</strong>, so the activity stops here.</p>
        <div class="actions">
          <button class="primary" onclick="restart()">Start again</button>
        </div>
      `;
    }

    function renderAdStep() {
      const ad = ads[state.adIndex];
      const round = state.adIndex + 1;
      updateProgress(`Ad ${round} of ${ads.length}`);

      return `
        <p class="step-label">Advertisement</p>
        <h2>Show advertisement: ${escapeHtml(ad.category)}</h2>
        <p class="lede">This is the ad exposure screen for the current product category from your notes: toy, snack, educational, or apparel.</p>
        <section class="flow-card">
          <article class="ad-panel">
            <div class="ad-topline">
              <span class="tag">${escapeHtml(ad.category)}</span>
              <span class="tag">${escapeHtml(ad.price)}</span>
            </div>
            <div class="ad-visual" style="background:${ad.theme}">
              <div>
                <span class="ad-emoji">${ad.emoji}</span>
                <h3 class="ad-title">${escapeHtml(ad.product)}</h3>
                <p class="ad-copy">${escapeHtml(ad.headline)} ${escapeHtml(ad.copy)}</p>
              </div>
            </div>
            <div class="ad-footer">
              <div class="price">${escapeHtml(ad.product)}</div>
              <button class="primary" onclick="showQuestion('desire')">Ask question</button>
            </div>
          </article>
          <aside class="side-panel">
            <section class="note">
              <strong>Study flow</strong>
              <p>1. Show the ad. 2. Ask how much the participant wants the product. 3. Ask how often they would request it from parents.</p>
            </section>
            <section class="summary-card">
              <h3>Progress</h3>
              <p>Round ${round} of ${ads.length}. Each completed round is stored and can be exported at the end.</p>
              <div class="stepper">
                ${ads.map((_, index) => `<span class="dot ${index < state.adIndex ? "done" : index === state.adIndex ? "active" : ""}"></span>`).join("")}
              </div>
            </section>
          </aside>
        </section>
      `;
    }

    function renderDesireQuestion() {
      const ad = ads[state.adIndex];
      updateProgress(`Rating ${state.adIndex + 1}/${ads.length}`);
      return `
        <p class="step-label">Question 1</p>
        <h2>How much do you want this product?</h2>
        <p class="lede">Select a value from 1 to 5, just like in your sketch where 1 means do not want and 5 means want strongly.</p>
        <section class="question-card">
          <h3>${escapeHtml(ad.product)} • ${escapeHtml(ad.category)}</h3>
          <div class="option-grid rating-grid">
            ${[1, 2, 3, 4, 5].map((value) => `
              <button class="option" onclick="setDesire(${value})">
                <strong>${value}</strong>
                <span>${desireLabels[value]}</span>
              </button>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderPesteringQuestion() {
      const ad = ads[state.adIndex];
      updateProgress(`Follow-up ${state.adIndex + 1}/${ads.length}`);
      return `
        <p class="step-label">Question 2</p>
        <h2>How many times would you ask your parents to buy this?</h2>
        <p class="lede">This follows your second handwritten question about asking once, twice, many times, or continuing until it is bought.</p>
        <section class="question-card">
          <h3>${escapeHtml(ad.product)} • Desire score selected: ${state.currentDesire}</h3>
          <div class="option-grid text-grid">
            ${pesteringOptions.map((option) => `
              <button class="option" onclick="setPestering('${option.value}')">
                <strong>${escapeHtml(option.label)}</strong>
                <span>${escapeHtml(option.description)}</span>
              </button>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderComplete() {
      updateProgress("Complete");
      const average = state.results.length
        ? (state.results.reduce((sum, item) => sum + item.desireScore, 0) / state.results.length).toFixed(2)
        : "0.00";

      return `
        <p class="step-label">Study Complete</p>
        <h2>Responses captured successfully</h2>
        <p class="lede">The prototype has now completed the full flow from your notebook. You can review the responses, export them, or restart the session.</p>
        <section class="results">
          <article class="summary-card">
            <strong>Consent</strong>
            <p>${state.consent ? "Agreed to participate" : "Not agreed"}</p>
          </article>
          <article class="summary-card">
            <strong>Total ads shown</strong>
            <p>${state.results.length}</p>
          </article>
          <article class="summary-card">
            <strong>Average desire score</strong>
            <p>${average}</p>
          </article>
        </section>
        <section class="summary-card">
          <h3>Recorded responses</h3>
          <div class="results">
            ${state.results.map((item) => `
              <article class="summary-card">
                <strong>${escapeHtml(item.category)}: ${escapeHtml(item.product)}</strong>
                <ul>
                  <li>Desire score: ${item.desireScore} (${escapeHtml(desireLabels[item.desireScore])})</li>
                  <li>Ask parents: ${escapeHtml(formatPestering(item.pestering))}</li>
                </ul>
              </article>
            `).join("")}
          </div>
        </section>
        <div class="actions">
          <button class="primary" onclick="downloadCSV()">Export CSV</button>
          <button class="secondary" onclick="copyJSON()">Copy JSON</button>
          <button class="ghost" onclick="restart()">Restart</button>
        </div>
      `;
    }

    function formatPestering(value) {
      const match = pesteringOptions.find((option) => option.value === value);
      return match ? match.label : value;
    }

    function setConsent(agreed) {
      state.consent = agreed;
      state.screen = agreed ? "ad" : "declined";
      render();
    }

    function showQuestion(kind) {
      state.screen = kind;
      render();
    }

    function setDesire(value) {
      state.currentDesire = value;
      state.screen = "pestering";
      render();
    }

    function setPestering(value) {
      const ad = ads[state.adIndex];
      state.results.push({
        adId: ad.id,
        category: ad.category,
        product: ad.product,
        price: ad.price,
        desireScore: state.currentDesire,
        desireLabel: desireLabels[state.currentDesire],
        pestering: value,
        pesteringLabel: formatPestering(value),
        recordedAt: new Date().toISOString()
      });

      state.currentDesire = null;
      state.adIndex += 1;
      state.screen = state.adIndex >= ads.length ? "complete" : "ad";
      render();
    }

    function restart() {
      state.consent = null;
      state.screen = "consent";
      state.adIndex = 0;
      state.currentDesire = null;
      state.results = [];
      render();
    }

    function buildCSV() {
      if (!state.results.length) {
        return "adId,category,product,price,desireScore,desireLabel,pestering,pesteringLabel,recordedAt";
      }

      const headers = Object.keys(state.results[0]);
      const rows = state.results.map((row) =>
        headers.map((key) => `"${String(row[key]).replaceAll('"', '""')}"`).join(",")
      );

      return [headers.join(","), ...rows].join("\n");
    }

    function downloadCSV() {
      const csv = buildCSV();
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "ad-influence-responses.csv";
      link.click();
      URL.revokeObjectURL(url);
    }

    async function copyJSON() {
      const payload = JSON.stringify(state.results, null, 2);
      try {
        await navigator.clipboard.writeText(payload);
        alert("JSON copied to clipboard.");
      } catch (error) {
        alert("Clipboard access failed. Open the console to copy the data.");
        console.error(payload);
      }
    }

    function render() {
      const screen = document.getElementById("screen");

      if (state.screen === "consent") {
        screen.innerHTML = renderConsent();
        return;
      }

      if (state.screen === "declined") {
        screen.innerHTML = renderDeclined();
        return;
      }

      if (state.screen === "ad") {
        screen.innerHTML = renderAdStep();
        return;
      }

      if (state.screen === "desire") {
        screen.innerHTML = renderDesireQuestion();
        return;
      }

      if (state.screen === "pestering") {
        screen.innerHTML = renderPesteringQuestion();
        return;
      }

      screen.innerHTML = renderComplete();
    }

    render();
  </script>
</body>
</html>
