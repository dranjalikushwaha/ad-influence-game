<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Video Survey</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(99,102,241,0.25), transparent 30%),
        radial-gradient(circle at bottom right, rgba(168,85,247,0.22), transparent 30%),
        linear-gradient(135deg, #050816 0%, #0f172a 45%, #111827 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: rgba(17, 24, 39, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .header {
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
    }

    .header h1 {
      font-size: 34px;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .header p {
      color: #aaa;
    }

    video {
      width: 100%;
      height: 550px;
      object-fit: cover;
      background: black;
    }

    .question-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .question-box {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      padding: 42px;
      border-radius: 28px;
      width: 100%;
      max-width: 720px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    .question-box h2 {
      margin-bottom: 30px;
      font-size: 30px;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .answers button {
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .answers button:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 25px rgba(99,102,241,0.25);
    }

    .footer {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-bar {
      width: 250px;
      height: 12px;
      background: #222;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #6366f1, #06b6d4);
      transition: width 0.5s ease;
    }

    .result-screen {
      display: none;
      text-align: center;
      padding: 80px 20px;
    }

    .result-screen h2 {
      font-size: 50px;
      margin-bottom: 20px;
    }

    .result-screen p {
      font-size: 24px;
      color: #bbb;
      margin-bottom: 30px;
    }

    .restart-btn {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: white;
      color: black;
      font-weight: bold;
      transition: 0.3s;
    }

    .restart-btn:hover {
      transform: scale(1.05);
    }

    .video-wrapper {
      position: relative;
    }

    @media(max-width: 768px) {
      .answers {
        grid-template-columns: 1fr;
      }

      video {
        height: 300px;
      }

      .header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div id="welcomeScreen" style="padding:60px 30px; text-align:center;">
    <h1 style="font-size:48px; margin-bottom:15px;">Welcome</h1>
    <p style="color:#aaa; margin-bottom:40px; font-size:18px;">Please enter your details before starting the survey.</p>

    <div style="max-width:500px; margin:0 auto; display:flex; flex-direction:column; gap:20px;">
      <input 
        type="text" 
        id="userName" 
        placeholder="Enter your name"
        style="padding:18px; border-radius:14px; border:1px solid #333; background:#1a1a1a; color:white; font-size:18px; outline:none;"
      >

      <input 
        type="number" 
        id="userAge" 
        placeholder="Enter your age"
        style="padding:18px; border-radius:14px; border:1px solid #333; background:#1a1a1a; color:white; font-size:18px; outline:none;"
      >

      <button 
        onclick="startSurvey()"
        style="padding:18px; border:none; border-radius:14px; background: linear-gradient(135deg, #8b5cf6, #6366f1);
        color:white; font-size:20px; font-weight:bold; cursor:pointer; transition:0.3s;"
      >
        Start Survey
      </button>
    </div>
  </div>
  <div id="mainQuiz" style="display:none;">
  <div class="header">
    <div>
      <h1>Interactive Video Quiz</h1>
      <p>Watch the video and answer the survey questions.</p>
    </div>

    <div>
      <strong id="progressText">1 / 4</strong>
    </div>
  </div>

  <div id="quizContent">
    <div class="video-wrapper">
      <video id="videoPlayer" controls></video>

      <div id="playOverlay" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.45); cursor:pointer; transition:0.3s;">
        <button id="playButton" style="width:110px; height:110px; border-radius:50%; border:none; background:white; color:black; font-size:42px; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,0.5); transition:0.3s;">
          ▶
        </button>
      </div>

      <div class="question-overlay" id="questionOverlay">
        <div class="question-box">
          <h2 id="questionText"></h2>
          <div class="answers" id="answersContainer"></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>
        <div style="color:#999; font-size:14px;">Score</div>
        <div style="font-size:30px; font-weight:bold;" id="scoreText">0</div>
      </div>

      <div class="progress-bar">
        <div class="progress" id="progressBar"></div>
      </div>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <h2>Survey Completed 🎉</h2>
    <p id="finalScore"></p>
    <button class="restart-btn" onclick="restartQuiz()">Restart Quiz</button>
  </div>
</div>

</div>

<script>
  const videoData = [
    {
      video: encodeURI('./WhatsApp Video 2026-05-27 at 10.11.43.mp4'),
      questions: [
        {
          question: 'Do you want this product?',
          answers: [
            'Do not want',
            'Slightly want',
            'Neutral',
            'Want',
            'Want Strongly'
          ]
        },
        {
          question: 'How many times would you ask your parents to buy this?',
          answers: [
            'Once',
            'Twice',
            'Many times',
            'Keep insisting until bought'
          ]
        }
      ]
    }
  ];

  let currentIndex = 0;
  let currentQuestionIndex = 0;
  let userName = '';
  let userAge = '';
  let score = 0;

  const videoPlayer = document.getElementById('videoPlayer');
  const questionOverlay = document.getElementById('questionOverlay');
  const questionText = document.getElementById('questionText');
  const answersContainer = document.getElementById('answersContainer');
  const progressText = document.getElementById('progressText');
  const progressBar = document.getElementById('progressBar');
  const scoreText = document.getElementById('scoreText');
  const resultScreen = document.getElementById('resultScreen');
  const finalScore = document.getElementById('finalScore');
  const quizContent = document.getElementById('quizContent');
  const playOverlay = document.getElementById('playOverlay');
  const playButton = document.getElementById('playButton');
  const welcomeScreen = document.getElementById('welcomeScreen');
  const mainQuiz = document.getElementById('mainQuiz');

  function startSurvey() {
    const nameInput = document.getElementById('userName').value.trim();
    const ageInput = document.getElementById('userAge').value.trim();

    if(nameInput === '' || ageInput === '') {
      alert('Please enter both name and age.');
      return;
    }

    userName = nameInput;
    userAge = ageInput;

    welcomeScreen.style.display = 'none';
    mainQuiz.style.display = 'block';

    // Survey loads after clicking Start Survey
  }

  function loadVideo() {
    questionOverlay.style.display = 'none';
    const current = videoData[currentIndex];

    videoPlayer.src = current.video;
    const currentQuestion = current.questions[currentQuestionIndex];

    questionText.innerText = currentQuestion.question;

    answersContainer.innerHTML = '';

    currentQuestion.answers.forEach(answer => {
      const button = document.createElement('button');
      button.innerText = answer;

      button.onclick = () => {
        button.style.background = '#444';

        setTimeout(() => {
          questionOverlay.style.display = 'none';

          currentQuestionIndex++;

          if(currentQuestionIndex < current.questions.length) {
            questionOverlay.style.display = 'flex';
            loadVideo();
          } else {
            finishQuiz();
          }
        }, 1500);
      };

      answersContainer.appendChild(button);
    });

    playOverlay.style.display = 'flex';
  }

  playOverlay.addEventListener('click', () => {
    videoPlayer.play();
    playOverlay.style.display = 'none';
  });

  videoPlayer.addEventListener('play', () => {
    playOverlay.style.display = 'none';
  });

  videoPlayer.addEventListener('pause', () => {
    if(!videoPlayer.ended) {
      playOverlay.style.display = 'flex';
    }
  });

  videoPlayer.addEventListener('ended', () => {
    questionOverlay.style.display = 'flex';
  });

  function updateProgress() {
    progressText.innerText = `${currentQuestionIndex + 1} / 2`;
    progressBar.style.width = `${((currentQuestionIndex + 1) / 2) * 100}%`;
  }

  function finishQuiz() {
    quizContent.style.display = 'none';
    resultScreen.style.display = 'block';
    finalScore.innerText = `${userName}, age ${userAge}, thank you for completing the survey.`;
  }

  function restartQuiz() {
    currentIndex = 0;
    score = 0;
    currentQuestionIndex = 0;
    scoreText.innerText = '0';

    quizContent.style.display = 'block';
    resultScreen.style.display = 'none';

    updateProgress();
    loadVideo();
  }

  updateProgress();
  loadVideo();
</script>

</body>
</html>
