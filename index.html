<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Children Ad Recall Survey</title>
  
  <script>
    (function() {
      try {
        var _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _fetch; },
          set: function(v) { _fetch = v; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn("Fetch patch ignored:", e);
      }
    })();
  </script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
    @keyframes drift-slow-1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -60px) scale(1.1); }
    }
    @keyframes drift-slow-2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-50px, 40px) scale(0.95); }
    }
    .animate-drift-1 { animation: drift-slow-1 25s ease-in-out infinite; }
    .animate-drift-2 { animation: drift-slow-2 30s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col relative overflow-x-hidden select-none">

  <!-- BACKGROUND DECORATION -->
  <div class="fixed inset-0 -z-10 overflow-hidden bg-slate-100">
    <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-orange-100/40 blur-3xl animate-drift-1"></div>
    <div class="absolute top-[60%] -right-20 w-80 h-80 rounded-full bg-slate-200/50 blur-2xl animate-drift-2"></div>
    <div class="absolute inset-0 opacity-[0.03]" style="background-image: linear-gradient(to right, #000 1px, transparent 1px), linear-gradient(to bottom, #000 1px, transparent 1px); background-size: 40px 40px;"></div>
  </div>

  <!-- SETTINGS BUTTON -->
  <button onclick="toggleAdminPanel()" class="fixed top-4 right-4 bg-white/90 hover:bg-white text-slate-700 p-2.5 rounded-full shadow-lg border border-orange-100 hover:scale-105 transition-all z-40 flex items-center justify-center gap-1.5 cursor-pointer text-xs font-bold">
    <i data-lucide="settings" class="w-4 h-4 text-orange-500"></i>
    <span class="hidden sm:inline">Settings</span>
  </button>

  <!-- HEADER -->
  <header class="w-full h-16 flex items-center justify-between px-6 md:px-8 bg-orange-500 text-white font-semibold shadow-md relative z-30 shrink-0">
    <div class="flex items-center gap-3">
      <span class="text-base md:text-lg tracking-tight uppercase font-black">Ad Research Portal</span>
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
    </div>
    <div class="flex items-center gap-4 text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-orange-5/90">
      <span id="header-records-badge" class="bg-orange-600/60 px-2.5 py-1 rounded-md text-white font-black">Records: 0</span>
    </div>
  </header>

  <!-- MAIN APP STAGE -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-8 flex items-center justify-center relative z-20">
    
    <!-- STAGE 1: DEMOGRAPHICS -->
    <div id="stage-demographics" class="w-full flex justify-center">
      <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col border border-slate-200">
        <div class="bg-orange-500 p-6 md:p-8 text-white text-center">
          <h2 class="text-2xl md:text-3xl font-bold font-display uppercase">Demographics</h2>
          <p class="text-orange-100 text-sm mt-1">Please fill in the details to begin</p>
        </div>
        <form id="demographics-form" onsubmit="submitDemographics(event)" class="p-6 md:p-8 space-y-6">
          <div id="demo-error" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-center font-bold text-sm"></div>
          
          <div class="space-y-2">
            <label class="block text-xs uppercase font-extrabold text-slate-500">1. Full Name:</label>
            <input type="text" id="input-name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 focus:border-orange-500 transition-all text-sm">
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
              <label class="block text-xs uppercase font-extrabold text-slate-500">2. Age:</label>
              <select id="input-age" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm">
                <option value="">Select Age...</option>
                <script>for(let i=4;i<=18;i++) document.write(`<option value="${i}">${i} Years Old</option>`)</script>
              </select>
            </div>
            <div class="space-y-2">
              <label class="block text-xs uppercase font-extrabold text-slate-500">3. Class Group:</label>
              <select id="input-class" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm">
                <option value="">Select Class...</option>
                <option value="Pre-School">Kindergarten</option>
                <script>for(let i=1;i<=12;i++) document.write(`<option value="Class ${i}">Grade ${i}</option>`)</script>
              </select>
            </div>
          </div>

          <div class="space-y-2.5">
            <label class="block text-xs uppercase font-extrabold text-slate-500">4. Gender:</label>
            <input type="hidden" id="input-gender" value="">
            <div class="grid grid-cols-3 gap-3">
              <button type="button" onclick="selectGender('Boy', this)" class="gender-btn border py-3 rounded-xl font-bold text-sm bg-slate-50">Boy 👦</button>
              <button type="button" onclick="selectGender('Girl', this)" class="gender-btn border py-3 rounded-xl font-bold text-sm bg-slate-50">Girl 👧</button>
              <button type="button" onclick="selectGender('Other', this)" class="gender-btn border py-3 rounded-xl font-bold text-sm bg-slate-50">Other 😊</button>
            </div>
          </div>

          <div class="space-y-2.5">
            <label class="block text-xs uppercase font-extrabold text-slate-500">5. School Type:</label>
            <input type="hidden" id="input-school" value="">
            <div class="grid grid-cols-2 gap-3">
              <button type="button" onclick="selectSchool('Private', this)" class="school-btn border p-3 rounded-xl text-center bg-slate-50 text-sm font-bold">Private</button>
              <button type="button" onclick="selectSchool('Government', this)" class="school-btn border p-3 rounded-xl text-center bg-slate-50 text-sm font-bold">Government</button>
            </div>
          </div>

          <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
            <label class="flex items-start gap-3 cursor-pointer">
              <input type="checkbox" id="input-consent" class="w-5 h-5 accent-orange-500 mt-0.5">
              <div class="text-xs text-slate-600">I agree to participate in this survey. I will watch 4 ads and answer questions.</div>
            </label>
          </div>

          <button type="submit" class="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white font-extrabold rounded-xl text-xs uppercase tracking-wider transition-all">
            Start Session
          </button>
        </form>
      </div>
    </div>

    <!-- STAGE 3: VIDEOS -->
    <div id="stage-videos" class="hidden w-full flex justify-center">
      <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-orange-500 p-5 text-white text-center">
          <span id="video-count-badge" class="bg-orange-700 text-white px-2 py-0.5 text-[10px] font-bold uppercase rounded-full">Ad 1 of 4</span>
          <h2 id="video-title" class="text-lg font-bold font-display uppercase mt-2">Loading...</h2>
        </div>
        <div class="p-6 md:p-8 space-y-6 flex flex-col items-center">
          <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden">
            <video id="f-player" onended="videoPlayEnded()" class="w-full h-full object-contain"></video>
            <div id="video-play-overlay" class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center cursor-pointer" onclick="startActivePlayback()">
              <div class="w-16 h-16 bg-orange-500 text-white rounded-full flex items-center justify-center shadow-lg"><i data-lucide="play" class="fill-current ml-1"></i></div>
            </div>
          </div>
          <button id="video-continue-btn" disabled onclick="advanceToNextVideo()" class="w-full opacity-50 bg-orange-500 text-white font-bold py-3 px-6 rounded-xl text-xs uppercase">
            Please watch the full video
          </button>
        </div>
      </div>
    </div>

    <!-- STAGE 4: QUESTIONNAIRE -->
    <div id="stage-questionnaire" class="hidden w-full flex justify-center">
      <div class="w-full max-w-4xl bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col border border-slate-200">
        <div class="bg-slate-50 p-6 border-b border-slate-100">
          <div class="flex justify-between items-center mb-2">
            <span id="question-category-code" class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-[10px] font-bold uppercase">Recall</span>
            <span id="question-count-label" class="text-slate-400 text-xs font-bold">1 / 26</span>
          </div>
          <h2 id="question-text" class="text-xl md:text-2xl font-semibold text-slate-800">"Loading question..."</h2>
        </div>
        <div class="p-8 md:p-12">
          <div class="grid grid-cols-5 gap-2 sm:gap-4">
            <button onclick="selectRating(1)" class="group flex flex-col items-center gap-2">
              <div id="likert-box-1" class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl border-2 border-slate-100 flex items-center justify-center font-bold text-slate-400">1</div>
              <span class="text-[9px] font-bold uppercase text-slate-400">Strongly Disagree</span>
            </button>
            <button onclick="selectRating(2)" class="group flex flex-col items-center gap-2">
              <div id="likert-box-2" class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl border-2 border-slate-100 flex items-center justify-center font-bold text-slate-400">2</div>
              <span class="text-[9px] font-bold uppercase text-slate-400">Disagree</span>
            </button>
            <button onclick="selectRating(3)" class="group flex flex-col items-center gap-2">
              <div id="likert-box-3" class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl border-2 border-slate-100 flex items-center justify-center font-bold text-slate-400">3</div>
              <span class="text-[9px] font-bold uppercase text-slate-400">Neutral</span>
            </button>
            <button onclick="selectRating(4)" class="group flex flex-col items-center gap-2">
              <div id="likert-box-4" class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl border-2 border-slate-100 flex items-center justify-center font-bold text-slate-400">4</div>
              <span class="text-[9px] font-bold uppercase text-slate-400">Agree</span>
            </button>
            <button onclick="selectRating(5)" class="group flex flex-col items-center gap-2">
              <div id="likert-box-5" class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl border-2 border-slate-100 flex items-center justify-center font-bold text-slate-400">5</div>
              <span class="text-[9px] font-bold uppercase text-slate-400">Strongly Agree</span>
            </button>
          </div>
        </div>
        <div class="bg-slate-50 p-6 border-t border-slate-100 flex justify-between items-center">
          <button id="ques-prev-btn" onclick="prevQuestion()" class="px-6 py-2 rounded-lg border border-slate-300 text-xs font-bold text-slate-500">Back</button>
          <button id="ques-next-btn" onclick="nextQuestion()" class="px-8 py-2.5 rounded-lg bg-orange-500 text-white text-xs font-bold uppercase">Next</button>
        </div>
      </div>
    </div>

    <!-- STAGE 5: COMPLETED -->
    <div id="stage-completed" class="hidden w-full flex justify-center">
      <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-10 flex flex-col items-center text-center space-y-6">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center"><i data-lucide="check" class="w-10 h-10"></i></div>
        <h2 class="text-2xl font-bold font-display uppercase">Thank You!</h2>
        <p class="text-slate-500 text-sm">Your responses have been recorded successfully.</p>
        <button onclick="location.reload()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold text-xs uppercase">New Participant</button>
      </div>
    </div>

  </main>

  <!-- ADMIN MODAL -->
  <div id="admin-panel" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl w-full max-w-xl shadow-2xl overflow-hidden">
      <div class="bg-slate-800 p-4 text-white flex justify-between items-center">
        <span class="font-bold flex items-center gap-2"><i data-lucide="shield" class="w-4 h-4"></i> Admin Panel</span>
        <button onclick="toggleAdminPanel()"><i data-lucide="x"></i></button>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Google Script URL</label>
          <input type="text" id="script-url-input" class="w-full border p-2 rounded-lg text-xs" placeholder="https://script.google.com/...">
          <button onclick="saveScriptUrl()" class="mt-2 bg-orange-500 text-white text-[10px] px-3 py-1.5 rounded font-bold uppercase">Save URL</button>
        </div>
        <div class="border-t pt-4">
          <div class="flex justify-between mb-2">
            <span class="text-xs font-bold uppercase">Local Data</span>
            <button onclick="exportCSV()" class="text-emerald-600 text-[10px] font-bold uppercase">Export CSV</button>
          </div>
          <div class="max-h-40 overflow-y-auto border rounded text-[10px]">
             <table class="w-full text-left" id="admin-table">
               <thead class="bg-slate-50"><tr><th class="p-2">Name</th><th class="p-2">Time</th></tr></thead>
               <tbody id="admin-table-body"></tbody>
             </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeVideoIndex = 0;
    let demographicsData = {};
    let userAnswers = {};
    let currentQuestionIndex = 0;
    let surveyScriptUrl = localStorage.getItem("survey_script_url") || "";

    const VIDEOS = [
      { title: "Big Babool Crow", url: "https://raw.githubusercontent.com/dranjalikushwaha/ad-influence-game/main/Big%20babool%20crow%20ad.mp4" },
      { title: "Boost Play Bigger", url: "https://raw.githubusercontent.com/dranjalikushwaha/ad-influence-game/main/vidssave.com%20Boost%20%23PlayABiggerGame%202018%20720P.mp4" },
      { title: "Kelloggs Chocos", url: "https://raw.githubusercontent.com/dranjalikushwaha/ad-influence-game/main/vidssave.com%20Kellogg%E2%80%99s%20Multigrain%20Chocos%20_%20Multigrain%20Energy%2C%20More%20Chocolatey%20_%20Hindi%2030%20sec%201080P.mp4" },
      { title: "Kissan Jam", url: "https://raw.githubusercontent.com/dranjalikushwaha/ad-influence-game/main/vidssave.com%20Kissan%20Jam%20(Hindi)%20720P.mp4" }
    ];

    const SURVEY_QUESTIONS = [
      { id: "AR1", text: "I watched all the advertisements carefully." },
      { id: "AR2", text: "I remember all the products shown." },
      { id: "AR3", text: "The advertisements were interesting." },
      { id: "PD1", text: "I want to buy these products." },
      { id: "PD2", text: "I will ask my parents for these products." }
      // ... Add more as needed
    ];

    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      refreshStats();
      document.getElementById("script-url-input").value = surveyScriptUrl;
    });

    function toggleAdminPanel() { 
      document.getElementById("admin-panel").classList.toggle("hidden"); 
      buildAdminTable();
    }

    function selectGender(v, btn) {
      demographicsData.gender = v;
      document.querySelectorAll(".gender-btn").forEach(b => b.classList.replace("bg-slate-800", "bg-slate-50"));
      document.querySelectorAll(".gender-btn").forEach(b => b.classList.remove("text-white"));
      btn.classList.replace("bg-slate-50", "bg-slate-800");
      btn.classList.add("text-white");
    }

    function selectSchool(v, btn) {
      demographicsData.schoolType = v;
      document.querySelectorAll(".school-btn").forEach(b => b.classList.replace("bg-orange-500", "bg-slate-50"));
      document.querySelectorAll(".school-btn").forEach(b => b.classList.remove("text-white"));
      btn.classList.replace("bg-slate-50", "bg-orange-500");
      btn.classList.add("text-white");
    }

    function submitDemographics(e) {
      e.preventDefault();
      demographicsData.name = document.getElementById("input-name").value;
      if(!demographicsData.name || !demographicsData.gender) return alert("Please fill name and gender");
      showStage("stage-videos");
      loadVideo();
    }

    function loadVideo() {
      const v = VIDEOS[activeVideoIndex];
      const player = document.getElementById("f-player");
      document.getElementById("video-title").innerText = v.title;
      document.getElementById("video-count-badge").innerText = `Ad ${activeVideoIndex+1} of 4`;
      player.src = v.url;
      player.load();
      document.getElementById("video-play-overlay").classList.remove("hidden");
      document.getElementById("video-continue-btn").disabled = true;
      document.getElementById("video-continue-btn").classList.add("opacity-50");
    }

    function startActivePlayback() {
      document.getElementById("f-player").play();
      document.getElementById("video-play-overlay").classList.add("hidden");
    }

    function videoPlayEnded() {
      const btn = document.getElementById("video-continue-btn");
      btn.disabled = false;
      btn.classList.remove("opacity-50");
      btn.innerText = activeVideoIndex < 3 ? "Next Video" : "Start Questions";
    }

    function advanceToNextVideo() {
      if(activeVideoIndex < 3) {
        activeVideoIndex++;
        loadVideo();
      } else {
        showStage("stage-questionnaire");
        loadQuestion();
      }
    }

    function loadQuestion() {
      const q = SURVEY_QUESTIONS[currentQuestionIndex];
      document.getElementById("question-text").innerText = `"${q.text}"`;
      document.getElementById("question-count-label").innerText = `${currentQuestionIndex+1} / ${SURVEY_QUESTIONS.length}`;
      highlightLikert(userAnswers[q.id]);
    }

    function selectRating(v) {
      userAnswers[SURVEY_QUESTIONS[currentQuestionIndex].id] = v;
      highlightLikert(v);
      setTimeout(() => {
        if(currentQuestionIndex < SURVEY_QUESTIONS.length - 1) {
          currentQuestionIndex++;
          loadQuestion();
        }
      }, 200);
    }

    function highlightLikert(v) {
      for(let i=1;i<=5;i++) {
        const box = document.getElementById(`likert-box-${i}`);
        box.className = (i === v) 
          ? "w-12 h-12 sm:w-16 sm:h-16 rounded-2xl border-4 border-orange-500 bg-orange-50 flex items-center justify-center font-bold text-orange-600 scale-110 transition-all"
          : "w-12 h-12 sm:w-16 sm:h-16 rounded-2xl border-2 border-slate-100 flex items-center justify-center font-bold text-slate-400";
      }
    }

    function nextQuestion() {
      if(currentQuestionIndex === SURVEY_QUESTIONS.length - 1) {
        submitFinal();
      } else {
        currentQuestionIndex++;
        loadQuestion();
      }
    }

    function prevQuestion() {
      if(currentQuestionIndex > 0) {
        currentQuestionIndex--;
        loadQuestion();
      }
    }

    async function submitFinal() {
      const payload = { ...demographicsData, answers: userAnswers, time: new Date().toLocaleString() };
      let logs = JSON.parse(localStorage.getItem("logs") || "[]");
      logs.push(payload);
      localStorage.setItem("logs", JSON.stringify(logs));
      
      if(surveyScriptUrl) {
        fetch(surveyScriptUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
      }
      
      showStage("stage-completed");
    }

    function showStage(id) {
      ["stage-demographics", "stage-videos", "stage-questionnaire", "stage-completed"].forEach(s => {
        document.getElementById(s).classList.add("hidden");
      });
      document.getElementById(id).classList.remove("hidden");
    }

    function refreshStats() {
      const logs = JSON.parse(localStorage.getItem("logs") || "[]");
      document.getElementById("header-records-badge").innerText = `Records: ${logs.length}`;
    }

    function saveScriptUrl() {
      surveyScriptUrl = document.getElementById("script-url-input").value;
      localStorage.setItem("survey_script_url", surveyScriptUrl);
      alert("Saved!");
    }

    function buildAdminTable() {
      const logs = JSON.parse(localStorage.getItem("logs") || "[]");
      const tbody = document.getElementById("admin-table-body");
      tbody.innerHTML = logs.map(l => `<tr><td class="p-2 border-b">${l.name}</td><td class="p-2 border-b">${l.time}</td></tr>`).join("");
    }

    function exportCSV() {
      const logs = JSON.parse(localStorage.getItem("logs") || "[]");
      let csv = "Name,Gender,Time\n";
      logs.forEach(l => csv += `${l.name},${l.gender},${l.time}\n`);
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', 'survey_data.csv');
      a.click();
    }
  </script>
</body>
</html>
